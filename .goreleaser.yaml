version: 2

project_name: reifu

before:
  hooks:
    - go vet ./...

builds:
  - id: reifu
    main: ./cmd/reifu
    binary: reifu
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/withnic/reifu/internal/app.Version=v{{.Version}} -X github.com/withnic/reifu/internal/app.Commit={{.FullCommit}} -X github.com/withnic/reifu/internal/app.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - HOWTO.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
